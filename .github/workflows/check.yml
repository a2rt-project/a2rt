name: Check A2RT website

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/a2rt/']
    env:
      SITE_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_protocol_docs.py
      - run: python scripts/build.py
      - run: python scripts/check_site.py
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: npm run check
        working-directory: worker
