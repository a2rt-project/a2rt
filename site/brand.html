<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A2RT · Logo</title>
  <link rel="icon" type="image/svg+xml" href="{{ base }}assets/favicon.svg?v={{ asset_version }}">
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#fbfcf9;color:#18291f;font-synthesis:none}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}a:hover{color:#347b4c}a:focus-visible{outline:2px solid #347b4c;outline-offset:6px}main{max-width:1200px;margin:auto;padding:32px 48px 40px}header,footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#64745f}header{padding-bottom:24px;border-bottom:1px solid #dfe6dd}header span{font-family:ui-monospace,monospace;letter-spacing:2px;color:#347b4c}header a{font-size:12px}.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:center;min-height:330px}.hero h1{font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.5;margin:12px 0 16px}.hero p{font-size:13px;line-height:1.9;color:#64745f;max-width:300px}.hero .label{font:10px ui-monospace,monospace;letter-spacing:2px;color:#65776c}.hero img{display:block;width:200px;max-width:100%;height:auto;margin:auto}.variants{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #2b352e;border-radius:12px;overflow:hidden}.variant{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:23px 20px 17px;background:#151c18}.variant img{width:130px;height:130px}.variant span{font:10px ui-monospace,monospace;letter-spacing:1px;color:#819287}.variant.light{background:#f2f4ec}.variant.light span{color:#69766b}.variant.lime{background:#347b4c}.variant.lime span{color:#fff}.details{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:26px 0;border-bottom:1px solid #dfe6dd}.sizes{display:flex;align-items:center;gap:18px}.sizes small{font:10px ui-monospace,monospace;color:#83938a;margin-right:5px}.sizes img{display:block}.downloads{display:flex;gap:20px;font-size:11px;color:#347b4c}footer{padding-top:23px;gap:15px;font-size:10px}.palette{display:flex;align-items:center;gap:8px}.palette i{height:8px;width:8px;border-radius:50%;background:#347b4c}@media(max-width:680px){main{padding:25px 24px}.hero{grid-template-columns:1fr;gap:15px;padding:40px 0;min-height:0}.hero h1{font-size:27px}.hero img{max-width:330px;margin:auto}.variants{grid-template-columns:repeat(3,1fr)}.variant{min-height:155px;padding:17px 7px}.variant img{width:85px;height:85px;max-width:100%}.variant span{font-size:8px;letter-spacing:0}.details{align-items:flex-start;flex-direction:column;gap:22px}.sizes{gap:15px}.sizes small{margin-right:0}footer{align-items:flex-start;line-height:1.7}.hero .label{font-size:9px}}
  </style>
</head>
<body>
<main>
  <header><span>A2RT / IDENTITY</span><a href="{{ base }}">返回官网 ↗</a></header>
  <section class="hero" aria-label="Logo 设计">
    <div><span class="label">THE LIVE CONNECTION</span><h1>连接，正在发生。</h1><p>九宫格与四角星。<br>秩序清晰的单元，与向外延伸的连接。</p></div>
    <img src="{{ base }}assets/logo-symbol.svg?v={{ asset_version }}" width="200" height="200" alt="A2RT：九宫格与四角星图形">
  </section>
  <section class="variants" aria-label="深浅底与单色图形">
    <div class="variant"><img src="{{ base }}assets/logo-symbol.svg?v={{ asset_version }}" width="130" height="130" alt="深色背景上的图形"><span>01 / DARK</span></div>
    <div class="variant light"><img src="{{ base }}assets/logo-symbol.svg?v={{ asset_version }}" width="130" height="130" alt="浅色背景上的图形"><span>02 / LIGHT</span></div>
    <div class="variant lime"><img src="{{ base }}assets/logo-symbol.svg?v={{ asset_version }}" width="130" height="130" alt="绿色背景上的图形"><span>03 / GREEN</span></div>
  </section>
  <div class="details">
    <div class="sizes" aria-label="16、24、32 和 48 像素图标"><small>SMALL, STILL CLEAR</small><img src="{{ base }}assets/favicon.svg?v={{ asset_version }}" width="16" height="16" alt="16 像素"><img src="{{ base }}assets/favicon.svg?v={{ asset_version }}" width="24" height="24" alt="24 像素"><img src="{{ base }}assets/favicon.svg?v={{ asset_version }}" width="32" height="32" alt="32 像素"><img src="{{ base }}assets/favicon.svg?v={{ asset_version }}" width="48" height="48" alt="48 像素"></div>
    <div class="downloads"><a href="{{ base }}assets/logo-symbol.svg?v={{ asset_version }}" download="a2rt-logo.svg">下载 LOGO SVG ↓</a></div>
  </div>
  <footer><span>Agent-to-Real-Time Protocol<br>为持续交互而设计。</span><span class="palette"><i></i>FOREST GREEN / #347B4C</span><span>矢量图形 · 透明背景 · 无字体依赖</span></footer>
</main>
</body>
</html>
