<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A2RT · Logo</title>
  <link rel="icon" type="image/svg+xml" href="{{ base }}assets/favicon.svg">
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#0b0e11;color:#eef2ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}a:hover{color:#b6f36a}a:focus-visible{outline:2px solid #b6f36a;outline-offset:6px}main{max-width:1200px;margin:auto;padding:32px 48px 40px}header,footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#99a49f}header{padding-bottom:24px;border-bottom:1px solid #28312d}header span{font-family:ui-monospace,monospace;letter-spacing:2px;color:#b6f36a}header a{font-size:12px}.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:center;min-height:330px}.hero h1{font-size:32px;font-weight:500;letter-spacing:-1px;line-height:1.5;margin:12px 0 16px}.hero p{font-size:13px;line-height:1.9;color:#929f98;max-width:300px}.hero .label{font:10px ui-monospace,monospace;letter-spacing:2px;color:#65776c}.hero img{display:block;width:100%;max-width:500px;height:auto}.variants{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #2b352e;border-radius:12px;overflow:hidden}.variant{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:23px 20px 17px;background:#151c18}.variant img{width:130px;height:130px}.variant span{font:10px ui-monospace,monospace;letter-spacing:1px;color:#819287}.variant.light{background:#f2f4ec}.variant.light span{color:#69766b}.variant.lime{background:#b6f36a}.variant.lime span{color:#415e33}.details{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:26px 0;border-bottom:1px solid #28312d}.sizes{display:flex;align-items:center;gap:18px}.sizes small{font:10px ui-monospace,monospace;color:#83938a;margin-right:5px}.sizes img{display:block}.downloads{display:flex;gap:20px;font-size:11px;color:#b6f36a}footer{padding-top:23px;gap:15px;font-size:10px}.palette{display:flex;align-items:center;gap:8px}.palette i{height:8px;width:8px;border-radius:50%;background:#b6f36a}@media(max-width:680px){main{padding:25px 24px}.hero{grid-template-columns:1fr;gap:15px;padding:40px 0;min-height:0}.hero h1{font-size:27px}.hero img{max-width:330px;margin:auto}.variants{grid-template-columns:repeat(3,1fr)}.variant{min-height:155px;padding:17px 7px}.variant img{width:85px;height:85px;max-width:100%}.variant span{font-size:8px;letter-spacing:0}.details{align-items:flex-start;flex-direction:column;gap:22px}.sizes{gap:15px}.sizes small{margin-right:0}footer{align-items:flex-start;line-height:1.7}.hero .label{font-size:9px}}
  </style>
</head>
<body>
<main>
  <header><span>A2RT / IDENTITY</span><a href="{{ base }}">返回官网 ↗</a></header>
  <section class="hero" aria-label="Logo 设计">
    <div><span class="label">THE LIVE CONNECTION</span><h1>连接，正在发生。</h1><p>折叠的 A，交错的轨道。<br>一道留白让信号自由穿行，<br>一个圆点标记实时的连接。</p></div>
    <img src="{{ base }}assets/logo.svg" width="500" height="158" alt="A2RT：荧光绿折叠 A 图形，搭配白色几何字标">
  </section>
  <section class="variants" aria-label="深浅底与单色图形">
    <div class="variant"><img src="{{ base }}assets/mark.svg" width="130" height="130" alt="深底荧光绿图形"><span>01 / SIGNAL</span></div>
    <div class="variant light"><img src="{{ base }}assets/mark-dark.svg" width="130" height="130" alt="浅底墨绿色图形"><span>02 / MONOCHROME</span></div>
    <div class="variant lime"><img src="{{ base }}assets/mark-dark.svg" width="130" height="130" alt="荧光绿底墨绿色图形"><span>03 / REVERSE</span></div>
  </section>
  <div class="details">
    <div class="sizes" aria-label="16、24、32 和 48 像素图标"><small>SMALL, STILL CLEAR</small><img src="{{ base }}assets/favicon.svg" width="16" height="16" alt="16 像素"><img src="{{ base }}assets/favicon.svg" width="24" height="24" alt="24 像素"><img src="{{ base }}assets/favicon.svg" width="32" height="32" alt="32 像素"><img src="{{ base }}assets/favicon.svg" width="48" height="48" alt="48 像素"></div>
    <div class="downloads"><a href="{{ base }}assets/logo.svg" download="a2rt-logo.svg">深底字标 SVG ↓</a><a href="{{ base }}assets/logo-dark.svg" download="a2rt-logo-dark.svg">浅底字标 SVG ↓</a><a href="{{ base }}assets/mark.svg" download="a2rt-mark.svg">图形 SVG ↓</a></div>
  </div>
  <footer><span>Agent-to-Real-Time Protocol<br>为持续交互而设计。</span><span class="palette"><i></i>SIGNAL LIME / #B6F36A</span><span>矢量图形 · 透明背景 · 无字体依赖</span></footer>
</main>
</body>
</html>
