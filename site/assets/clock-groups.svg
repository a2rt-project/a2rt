<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">A shared root clock, three independent synchronization groups</title>
<desc id="desc">Illustrative configuration: a 1000 Hz root clock supplies shared time and capacity. Child clocks define an interaction group with 100-tick windows and tactile and system_control groups with 10-tick windows. Groups advance independently. Group layout is a Profile choice.</desc>
<rect width="840" height="430" rx="16" fill="#f8fafd"/>
<g fill="none" stroke="#c2d7fa" stroke-width="1.5"><path d="M195 214h42V86h60M237 214h60M237 214v128h60"/><circle cx="237" cy="214" r="4" fill="#f8fafd"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<circle cx="113" cy="158" r="23" fill="#e8f0fe" stroke="#c2d7fa"/><g stroke="#0b57d0" stroke-width="1.5" fill="none"><circle cx="113" cy="158" r="14"/><path d="M113 148v10l7 4"/></g>
<text x="113" y="204" font-size="21" font-weight="600" text-anchor="middle" fill="#1f1f1f">root</text><text x="113" y="231" font-size="16" text-anchor="middle" fill="#0b57d0">1,000 Hz</text><text x="113" y="269" font-size="13" text-anchor="middle" fill="#5f6368">Shared time &amp; capacity</text><text x="113" y="291" font-size="12" text-anchor="middle" fill="#5f6368">1,024 B / unit · 1 unit / tick</text>
<g transform="translate(297 28)"><rect width="515" height="106" rx="10" fill="#fff" stroke="#dbe3f1"/><rect width="4" height="52" x="0" y="27" rx="2" fill="#0b57d0"/><text x="20" y="26" font-size="12" fill="#5f6368">interaction_clock · 100 root ticks / window</text><text x="20" y="54" font-size="19" fill="#0b57d0" font-weight="600">interaction</text><text x="20" y="82" font-size="13" fill="#425c81">speech · assistant_events · microphone · shared_state</text></g>
<g transform="translate(297 156)"><rect width="515" height="106" rx="10" fill="#fff" stroke="#dbe3f1"/><rect width="4" height="52" x="0" y="27" rx="2" fill="#526e97"/><text x="20" y="26" font-size="12" fill="#5f6368">sensor_clock · 10 root ticks / window</text><text x="20" y="54" font-size="19" fill="#526e97" font-weight="600">tactile</text><text x="20" y="82" font-size="13" fill="#425c81">touch</text><path d="M250 63v18m22-18v18m22-18v18m22-18v18m22-18v18m22-18v18m22-18v18m22-18v18m22-18v18m22-18v18" stroke="#526e97" stroke-width="3" stroke-linecap="round" opacity=".45"/></g>
