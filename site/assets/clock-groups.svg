<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">Clock tree, synchronization groups, and tracks</title>
<desc id="desc">One root clock provides shared time and capacity. Three child clocks bind independent interaction, tactile, and system groups. Each group contains configurable tracks.</desc>
<rect width="900" height="490" rx="14" fill="#f8fafd"/>
<g fill="none" stroke="#c2d7fa" stroke-width="2"><path d="M450 98v25H160v27M450 123v27M450 123h290v27M160 210v25M450 210v25M740 210v25M160 295v25M450 295v25M740 295v25"/></g>
<g stroke="#e0e3e7" fill="#ffffff"><rect x="260" y="20" width="380" height="78" rx="10"/><rect x="30" y="150" width="260" height="60" rx="8"/><rect x="320" y="150" width="260" height="60" rx="8"/><rect x="610" y="150" width="260" height="60" rx="8"/><rect x="30" y="235" width="260" height="60" rx="8" fill="#e8f0fe"/><rect x="320" y="235" width="260" height="60" rx="8" fill="#e8f0fe"/><rect x="610" y="235" width="260" height="60" rx="8" fill="#e8f0fe"/><rect x="30" y="320" width="260" height="130" rx="8"/><rect x="320" y="320" width="260" height="130" rx="8"/><rect x="610" y="320" width="260" height="130" rx="8"/></g>
<g fill="#0b57d0" font-family="ui-monospace,monospace" text-anchor="middle"><text x="450" y="49" font-size="21" font-weight="700">root · 1,000 Hz</text><text x="450" y="75" font-size="12">1,024 B / unit · 1 unit / root tick</text><text x="160" y="176" font-size="14">interaction_clock</text><text x="160" y="196" font-size="11">10 Hz · period 100</text><text x="450" y="176" font-size="14">sensor_clock</text><text x="450" y="196" font-size="11">100 Hz · period 10</text><text x="740" y="176" font-size="14">system_clock</text><text x="740" y="196" font-size="11">100 Hz · period 10</text><text x="160" y="261" font-size="15">interaction</text><text x="160" y="281" font-size="11">64 units / window</text><text x="450" y="261" font-size="15">tactile</text><text x="450" y="281" font-size="11">2 units / window</text><text x="740" y="261" font-size="15">system_control</text><text x="740" y="281" font-size="11">1 unit / window</text><text x="160" y="345" font-size="12">speech · output</text><text x="160" y="371" font-size="12">assistant_events · output</text><text x="160" y="397" font-size="12">microphone · input</text><text x="160" y="423" font-size="12">shared_state · bidirectional</text><text x="450" y="360" font-size="14">touch · input</text><text x="450" y="389" font-size="11">role: environment</text><text x="740" y="360" font-size="14">system · input</text><text x="740" y="389" font-size="11">role: system</text><text x="740" y="419" font-size="11">exactly one system track</text><text x="450" y="476" font-size="10" fill="#5f6368">Illustrative configuration · Group layout is a Profile choice · No latency guarantee</text></g>
</svg>
