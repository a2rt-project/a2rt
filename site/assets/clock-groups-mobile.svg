<svg xmlns="http://www.w3.org/2000/svg" width="420" height="590" viewBox="0 0 420 590" role="img" aria-labelledby="title desc"><title id="title">A shared root and independent groups</title><desc id="desc">The interaction group uses 100 root ticks per window. Tactile and system_control use 10 ticks per window. This is an illustrative Profile layout.</desc><rect width="420" height="590" rx="12" fill="#f8fafd"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><circle cx="210" cy="44" r="18" fill="#e8f0fe" stroke="#c2d7fa"/><path d="M210 34v10l7 4" fill="none" stroke="#0b57d0" stroke-width="1.5"/><text x="210" y="93" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">root · 1,000 Hz</text><text x="210" y="121" text-anchor="middle" font-size="14" fill="#5f6368">Shared time &amp; capacity</text><path d="M210 138v20M204 152l6 6 6-6" fill="none" stroke="#9ab7df" stroke-width="1.5"/><g transform="translate(20 174)"><rect width="380" height="106" rx="10" fill="#fff" stroke="#dbe3f1"/><rect width="4" height="52" x="0" y="27" rx="2" fill="#0b57d0"/><text x="20" y="26" font-size="12" fill="#5f6368">interaction_clock · 100 root ticks / window</text><text x="20" y="54" font-size="19" fill="#0b57d0" font-weight="600">interaction</text><text x="20" y="82" font-size="13" fill="#425c81">speech · assistant_events</text><text x="20" y="101" font-size="13" fill="#425c81">microphone · shared_state</text></g>
<g transform="translate(20 306)"><rect width="380" height="106" rx="10" fill="#fff" stroke="#dbe3f1"/><rect width="4" height="52" x="0" y="27" rx="2" fill="#526e97"/><text x="20" y="26" font-size="12" fill="#5f6368">sensor_clock · 10 root ticks / window</text><text x="20" y="54" font-size="19" fill="#526e97" font-weight="600">tactile</text><text x="20" y="82" font-size="13" fill="#425c81">touch</text></g>
<g transform="translate(20 438)"><rect width="380" height="106" rx="10" fill="#fff" stroke="#dbe3f1"/><rect width="4" height="52" x="0" y="27" rx="2" fill="#6762a8"/><text x="20" y="26" font-size="12" fill="#5f6368">system_clock · 10 root ticks / window</text><text x="20" y="54" font-size="19" fill="#6762a8" font-weight="600">system_control</text><text x="20" y="82" font-size="13" fill="#425c81">system · unique system input track</text></g>
<text x="210" y="576" font-size="12" fill="#5f6368" text-anchor="middle">Illustration · Group layout is a Profile choice</text></g></svg>
