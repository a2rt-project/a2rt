<div class="ps-search-modal" data-ps-search-modal hidden aria-hidden="true">
      <div class="ps-search-modal__backdrop" data-ps-search-close></div>
      <div class="ps-search-modal__dialog" role="dialog" aria-modal="true" aria-label="{{ ps_ui.search_placeholder }}">
        <form class="ps-search-modal__form" action="{{ search_action }}" method="get" autocomplete="off" data-ps-search-modal-form>
          <svg class="octicon ps-search-modal__icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/>
          </svg>
          <input type="search" class="ps-search-modal__input" name="q" placeholder="{{ ps_ui.search_or_ask_ai }}" aria-label="{{ ps_ui.search_or_ask_ai }}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-ps-search-modal-input>
          <input type="hidden" name="check_keywords" value="yes">
          <input type="hidden" name="area" value="default">
          <button class="ps-search-modal__close" type="button" aria-label="{{ ps_ui.close_search }}" title="{{ ps_ui.close_search }}" data-ps-search-close>
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
        </form>
        <div class="ps-search-modal__empty" data-ps-search-empty hidden>
          <div class="ps-search-modal__label ps-search-modal__label--ask-ai">
            <svg class="ps-search-modal__label-icon" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M5.5 1.75a.75.75 0 0 1 1.5 0V3h2V1.75a.75.75 0 0 1 1.5 0V3h.75A2.75 2.75 0 0 1 14 5.75v4.5A2.75 2.75 0 0 1 11.25 13h-6.5A2.75 2.75 0 0 1 2 10.25v-4.5A2.75 2.75 0 0 1 4.75 3h.75V1.75ZM4.75 4.5c-.69 0-1.25.56-1.25 1.25v4.5c0 .69.56 1.25 1.25 1.25h6.5c.69 0 1.25-.56 1.25-1.25v-4.5c0-.69-.56-1.25-1.25-1.25h-6.5ZM5 7.25a.75.75 0 0 1 1.5 0v.5a.75.75 0 0 1-1.5 0v-.5Zm4.5 0a.75.75 0 0 1 1.5 0v.5a.75.75 0 0 1-1.5 0v-.5ZM5.75 10a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1-.75-.75Z"/>
            </svg>
            <span>{{ ps_ui.ask_ai }}</span>
          </div>
          <div class="ps-search-modal__examples">
            {%- for example in ps_search_examples %}
              <button class="ps-search-modal__example" type="button" data-ps-search-example data-query="{{ example|e }}">
                <svg class="ps-search-modal__example-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 13.25 12H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 13.543V12H2.75A1.75 1.75 0 0 1 1 10.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h2a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h4.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/>
                </svg>
                <span>{{ example }}</span>
              </button>
            {%- endfor %}
          </div>
        </div>
        <div class="ps-search-modal__choices">
          <div class="ps-search-modal__group">
            <div class="ps-search-modal__label">{{ ps_ui.search_docs }}</div>
            <button class="ps-search-modal__choice" type="button" data-ps-search-docs>
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"/>
              </svg>
              <span data-ps-search-query>{{ ps_ui.search_placeholder }}</span>
            </button>
          </div>
          <div class="ps-search-modal__group ps-search-modal__group--ai" {% if not a2rt_ai_enabled %}hidden{% endif %}>
            <div class="ps-search-modal__label">{{ ps_ui.ai_search }}</div>
            <button class="ps-search-modal__choice" type="button" data-ps-search-ai data-ps-ai-query-row data-ps-language="{{ ps_current_language.code }}">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M5.5 1.75a.75.75 0 0 1 1.5 0V3h2V1.75a.75.75 0 0 1 1.5 0V3h.75A2.75 2.75 0 0 1 14 5.75v4.5A2.75 2.75 0 0 1 11.25 13h-6.5A2.75 2.75 0 0 1 2 10.25v-4.5A2.75 2.75 0 0 1 4.75 3h.75V1.75ZM4.75 4.5c-.69 0-1.25.56-1.25 1.25v4.5c0 .69.56 1.25 1.25 1.25h6.5c.69 0 1.25-.56 1.25-1.25v-4.5c0-.69-.56-1.25-1.25-1.25h-6.5ZM5 7.25a.75.75 0 0 1 1.5 0v.5a.75.75 0 0 1-1.5 0v-.5Zm4.5 0a.75.75 0 0 1 1.5 0v.5a.75.75 0 0 1-1.5 0v-.5ZM5.75 10a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 0 1.5h-3a.75.75 0 0 1-.75-.75Z"/>
              </svg>
              <span data-ps-ai-query>{{ ps_ui.search_placeholder }}</span>
            </button>
            <div class="ps-search-modal__challenge" data-turnstile-container hidden></div>
            <div class="ps-search-modal__loading" data-ps-ai-loading hidden aria-live="polite" aria-label="{{ ps_ui.ai_search_loading }}">
              <div class="ps-search-modal__spinner" aria-hidden="true"></div>
            </div>
            <div class="ps-search-modal__answer" aria-live="polite" data-ps-ai-answer hidden>
              <div class="ps-search-modal__answer-text" data-ps-ai-answer-text></div>
            </div>
            <div class="ps-search-modal__sources" data-ps-ai-sources hidden>
              <div class="ps-search-modal__label">{{ ps_ui.ai_search_sources }}</div>
              <div class="ps-search-modal__sources-list" data-ps-ai-sources-list></div>
            </div>
          </div>
        </div>
        <div class="ps-search-modal__notice" aria-live="polite" data-ps-ai-notice
             data-empty="{{ ps_ui.ai_search_empty }}"
             data-verifying="{{ ps_ui.ai_search_verifying }}"
             data-loading="{{ ps_ui.ai_search_loading }}"
             data-error="{{ ps_ui.ai_search_error }}"
             data-no-sources="{{ ps_ui.ai_search_no_sources }}"
             data-unavailable="{{ 'AI 问答尚未启用，请使用文档搜索。' if ps_current_language.code == 'zh' else 'AI is not enabled. Use documentation search.' }}"></div>
        {% if a2rt_ai_enabled %}<div class="ps-search-modal__retention" data-ps-ai-retention hidden>{{ ps_ui.ai_search_retention_notice }}</div>{% endif %}
      </div>
    </div>
